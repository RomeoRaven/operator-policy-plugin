[project]
name = "protoagent-operator-policy"
version = "0.1.0"
description = "Deterministic read-only attention selection for Operator Stack."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
